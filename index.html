<style id="css">
:root{--bg:#e9edf2;--tx:#1b2433;--a:#2f6fed;--bd:#8a94a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1b2433}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#1f2937}
.bar button{font-size:16px;padding:12px 16px;border:0;border-radius:10px;background:#2f6fed;color:#fff;font-weight:700}
.bar button.g{background:#374151}.bar span{color:#cbd5e1;align-self:center;font-size:13px;margin-left:auto}
#sheet{background:#fff;max-width:1100px;margin:14px auto;padding:26px 30px;border-radius:6px;box-shadow:0 2px 10px #0002}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lg{height:70px;width:auto}.logo{font-size:26px;font-weight:700;letter-spacing:.35em;line-height:1.15}.co{text-align:right;font-size:12px;line-height:1.5}
h1{text-align:center;font-size:20px;letter-spacing:.08em;margin:14px 0}
h3{font-size:14px;margin:18px 0 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
.f{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}.f label{white-space:nowrap}
input,textarea{font:inherit;font-size:16px;color:#1b2433;background:#fff;width:100%;min-width:0;border:0;border-bottom:1px dotted var(--bd);padding:9px 4px;border-radius:0}
input:focus,textarea:focus{outline:0;background:#eef3ff;border-bottom:2px solid var(--a)}
textarea{border:1px solid var(--bd);border-radius:4px;padding:8px;min-height:80px}
table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:12px;background:#f1f3f6}
th,td{border:1px solid var(--bd);padding:0}td input{border:0;padding:11px 6px;min-height:44px}
.n{width:38px;text-align:center;font-size:13px}.q{width:70px}
.add{margin-top:6px;font-size:14px;padding:9px 14px;border:1px solid var(--a);color:var(--a);background:#fff;border-radius:8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;margin-top:10px}
.pad{border:1px solid var(--bd);border-radius:4px;height:110px;width:100%;touch-action:none;background:#fff;display:block}
.clr{font-size:12px;padding:5px 10px;margin:4px 0;border:1px solid var(--bd);background:#fff;border-radius:6px}
.sgimg{height:110px;max-width:100%}
.list{position:fixed;inset:0;background:#0009;display:none;z-index:9;padding:20px}.list.on{display:block}
.box{background:#fff;max-width:560px;margin:30px auto;border-radius:12px;padding:16px;max-height:80%;overflow:auto}
.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #e5e7eb}.it b{flex:1;font-size:15px}.it small{color:#6b7280}
.it button{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--a);background:#fff;color:var(--a)}.it .d{border-color:#e5484d;color:#e5484d}
@media (max-width:700px){.cols,.sg{grid-template-columns:1fr}#sheet{padding:16px}}
@media print{.bar,.add,.clr,.list,.noprint{display:none!important}body{background:#fff}#sheet{box-shadow:none;margin:0;max-width:none;padding:0}input,textarea{font-size:12px}}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],LK='hg_surveys';
let cur=null;const sigs={};
function msg(t){$('#st').textContent=t;setTimeout(()=>$('#st').textContent='',4000)}
function addRow(id,v){const b=$('#'+id),n=b.rows.length+1,tr=b.insertRow();tr.innerHTML='<td class="n">'+n+'</td>'+[0,1,2,3].map(i=>'<td'+(i==1?' class="q"':'')+'><input></td>').join('');
 if(v)[...tr.querySelectorAll('input')].forEach((x,i)=>x.value=v[i]||'')}
function reset(){$$('[data-k]').forEach(i=>i.value='');['eq','co'].forEach(t=>{$('#'+t).innerHTML='';for(let i=0;i<(t=='eq'?10:8);i++)addRow(t)});
 ['td','kd'].forEach(k=>$('[data-k='+k+']').value=new Date().toISOString().slice(0,10));$$('canvas').forEach(clr);cur=null}
const rows=t=>[...$('#'+t).rows].map(r=>[...r.querySelectorAll('input')].map(i=>i.value));
function collect(){const f={};$$('[data-k]').forEach(i=>f[i.dataset.k]=i.value);const s={};$$('canvas').forEach(c=>s[c.dataset.s]=c.dataset.d?c.toDataURL():'');return{f,eq:rows('eq'),co:rows('co'),s}}
function load(d){reset();$$('[data-k]').forEach(i=>i.value=d.f[i.dataset.k]||'');['eq','co'].forEach(t=>{$('#'+t).innerHTML='';d[t].forEach(r=>addRow(t,r))});
 $$('canvas').forEach(c=>{const u=d.s[c.dataset.s];if(u){const im=new Image();im.onload=()=>{c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.dataset.d=1};im.src=u}})}
const all=()=>{try{return JSON.parse(localStorage.getItem(LK)||'[]')}catch(e){return[]}};
const put=a=>{try{localStorage.setItem(LK,JSON.stringify(a));return true}catch(e){msg('Storage full / unavailable');return false}};
function draft(){try{localStorage.setItem('hg_draft',JSON.stringify({cur,d:collect()}))}catch(e){}}
$('#bs').onclick=()=>{const d=collect(),a=all(),t=(d.f.cn||'No name')+' · '+(d.f.td||'');
 if(cur){const i=a.findIndex(x=>x.id==cur);if(i>=0)a[i]={id:cur,t,d,ts:Date.now()};else a.unshift({id:cur,t,d,ts:Date.now()})}else{cur=Date.now();a.unshift({id:cur,t,d,ts:cur})}
 if(put(a))msg('Saved ✓')};
$('#bn').onclick=()=>{if(confirm('Start a new blank survey? Unsaved changes will be lost.'))reset()};
function showList(){const a=all();$('#li').innerHTML=a.length?'':'<p>Nothing saved yet.</p>';a.forEach(x=>{const e=document.createElement('div');e.className='it';
 e.innerHTML='<b></b><small>'+new Date(x.ts).toLocaleDateString()+'</small><button>Open</button><button class="d">Delete</button>';e.querySelector('b').textContent=x.t;
 e.children[2].onclick=()=>{load(x.d);cur=x.id;$('#ls').classList.remove('on')};
 e.children[3].onclick=()=>{if(confirm('Delete this survey?')){put(all().filter(y=>y.id!=x.id));showList()}};$('#li').appendChild(e)});$('#ls').classList.add('on')}
$('#bl').onclick=showList;$('#lc').onclick=()=>$('#ls').classList.remove('on');$('#bp').onclick=()=>window.print();
$('#bd').onclick=()=>{
 const c=$('#sheet').cloneNode(true);c.querySelectorAll('input').forEach((i,k)=>i.setAttribute('value',$$('#sheet input')[k].value));
 c.querySelectorAll('textarea').forEach((t,k)=>t.textContent=$$('#sheet textarea')[k].value);
 c.querySelectorAll('canvas').forEach((x,k)=>{const o=$$('#sheet canvas')[k];if(o.dataset.d){const im=document.createElement('img');im.src=o.toDataURL();im.className='sgimg';x.replaceWith(im)}else x.remove()});
 c.querySelectorAll('.add,.clr').forEach(x=>x.remove());
 const h='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey</title><style>'+$('#css').textContent+'</style></head><body>'+c.outerHTML+'</body></html>';
 const n=($('[data-k=cn]').value||'survey').replace(/[^\w\-]+/g,'_');

/* ===== App features: email, settings, outbox ===== */
const CFG='hg_cfg';
const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch(e){return{}}};
$('#bt').onclick=()=>{const c=cfg();const u=prompt('Web app URL (ends with /exec):',c.url||'');if(u===null)return;const k=prompt('Secret key:',c.key||'');if(k===null)return;
 try{localStorage.setItem(CFG,JSON.stringify({url:u.trim(),key:k.trim()}))}catch(e){}msg('Settings saved')};
function store(want){const d=collect(),a=all(),t=(d.f.cn||'No name')+' · '+(d.f.td||'');if(!cur)cur=Date.now();
 const i=a.findIndex(x=>x.id==cur),rec={id:cur,t,d,ts:Date.now(),sent:false,want:!!want};
 if(i>=0)a[i]=rec;else a.unshift(rec);return put(a)?rec:null}
async function send(rec){const c=cfg();if(!c.url||!c.key){msg('Tap Settings and enter the web app URL and key first');return false}
 try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,id:rec.id+'_'+rec.ts,f:rec.d.f,eq:rec.d.eq,co:rec.d.co,s:rec.d.s})});
  const j=await r.json();if(j&&j.ok){const a=all(),i=a.findIndex(x=>x.id==rec.id&&x.ts==rec.ts);if(i>=0){a[i].sent=true;put(a)}return true}
  msg('Server refused: '+((j&&j.error)||'check the key'));return false}catch(e){return false}}
$('#be').onclick=async()=>{if(!$('[data-k=cn]').value){msg('Enter the client name first');return}
 const rec=store(true);if(!rec)return;msg('Sending…');
 if(await send(rec)){msg('Saved & emailed ✓');alert('Survey saved and emailed')}else msg('Saved on tablet – not sent yet (Saved surveys > Send)')};
$('#bs').onclick=()=>{if(store(false))msg('Saved ✓')};
function showList(){const a=all();$('#li').innerHTML=a.length?'':'<p>Nothing saved yet.</p>';a.forEach(x=>{const e=document.createElement('div');e.className='it';
 e.innerHTML='<b></b><small></small><button>Open</button><button>Send</button><button class="d">Delete</button>';
 e.querySelector('b').textContent=x.t;e.querySelector('small').textContent=x.sent?'✓ sent':'not sent';const bt=e.querySelectorAll('button');
 bt[0].onclick=()=>{load(x.d);cur=x.id;$('#ls').classList.remove('on')};
 bt[1].onclick=async()=>{msg('Sending…');const ok=await send(x);msg(ok?'Emailed ✓':'Not sent');showList()};
 bt[2].onclick=()=>{if(confirm('Delete this survey?')){put(all().filter(y=>y.id!=x.id));showList()}};$('#li').appendChild(e)});$('#ls').classList.add('on')}
async function flush(){if(!cfg().url||!navigator.onLine)return;for(const x of all().filter(y=>y.want&&!y.sent)){if(await send(x))msg('Sent: '+x.t)}}
addEventListener('online',flush);setTimeout(flush,3000);
